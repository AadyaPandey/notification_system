services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-notification_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-notification_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  create-topics:
    build: ./notification_service
    container_name: create-topics
    command: python create_topics.py
    depends_on:
      - kafka
    env_file:
      - .env  # Use root .env file
      - .env  # Use root .env file
    restart: "no"

  user-service:
    build: ./user_service
    container_name: user-service
    depends_on:
      - postgres
    ports:
      - "8001:8000"
    env_file:
      - .env  # Use root .env file
      - .env  # Use root .env file

  notification-service:
    build: ./notification_service
    container_name: notification-service
    depends_on:
      - postgres
      - kafka
    ports:
      - "8002:8000"
    env_file:
      - .env  # Use root .env file
      - .env  # Use root .env file

  email-consumer:
    build: ./notification_service
    container_name: email-consumer
    command: python -m notification_consumer.email_consumer
    depends_on:
      - postgres
      - kafka
      - create-topics
    env_file:
      - .env  # Use root .env file
      - .env  # Use root .env file

  sms-consumer:
    build: ./notification_service
    container_name: sms-consumer
    command: python -m notification_consumer.sms_consumer
    depends_on:
      - postgres
      - kafka
      - create-topics
    env_file:
      - .env  # Use root .env file
      - .env  # Use root .env file

  push-consumer:
    build: ./notification_service
    container_name: push-consumer
    command: python -m notification_consumer.push_consumer
    depends_on:
      - postgres
      - kafka
      - create-topics
    env_file:
      - .env  # Use root .env file
      - .env  # Use root .env file

  retry-consumer:
    build: ./notification_service
    container_name: retry-consumer
    command: python -m notification_consumer.retry_consumer
    depends_on:
      - postgres
      - kafka
      - create-topics
    env_file:
      - .env  # Use root .env file
  
  user-consumer:
    build: ./notification_service
    container_name: user-consumer
    command: python -m notification_consumer.user_consumer
    depends_on:
      - postgres
      - kafka
      - create-topics
    env_file:
      - .env

  dlq-consumer:
    build: ./notification_service
    container_name: dlq-consumer
    command: python -m notification_consumer.dlq_consumer
    depends_on:
      - postgres
      - kafka
      - create-topics
    env_file:
      - .env  # Use root .env file
      - .env  # Use root .env file

  api-gateway:
    build: ./api_gateway
    container_name: api-gateway
    depends_on:
      - user-service
      - notification-service
      - redis
    ports:
      - "8000:8000"
    env_file:
      - .env  # Use root .env file
      - .env  # Use root .env file

volumes:
  postgres_data: